name: CI/CD Pipeline

on:
  push:
    branches: [ "main","feature/**" ]
  workflow_dispatch:

jobs:
  test-infrastructure:
    name: Test Deployment in Kubernetes
    runs-on: ubuntu-latest
    steps:
      
      - name: Checkout code
        uses: actions/checkout@v3

      
      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1.4.0

      
      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.11.1'
      - name: Install Prometheus
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm install monitoring prometheus-community/kube-prometheus-stack --namespace monitoring --create-namespace --wait --timeout 10m

      
      - name: Deploy dstack with Helm
        run: |
          helm install my-dstack ./helm/dstack --wait --timeout 5m
      
      - name: Verify Pods
        run: kubectl get pods -A
